<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results · Networking Agent (Command · Harbor)</title>
<link rel="stylesheet" href="theme.css">
<script>try{var t=localStorage.getItem('cch-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-page="results" data-search="7258" data-density="comfortable">
<div class="app">
  <header class="topbar" id="topbar"></header>
  <div class="body">
    <aside class="side" id="side" aria-label="Searches"></aside>
    <main class="work" id="work">
      <section class="ctx" id="ctx" aria-label="Search summary"></section>
      <div class="split">
        <section class="list-pane" aria-label="Results list">
          <div class="toolbar" id="toolbar"></div>
          <div class="chips" id="chips" role="group" aria-label="Filters"></div>
          <div class="list-scroll" id="listScroll"><div id="rows"></div></div>
          <div class="list-foot" id="listFoot"></div>
        </section>
        <section class="detail" id="detail" aria-label="Details" aria-live="polite"></section>
      </div>
    </main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<script src="data.js"></script>
<script src="shell.js"></script>
<script src="results.js"></script>
</body>
</html>
