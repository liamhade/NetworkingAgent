<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Results: Agentic AI and backend roles | Networking Agent</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('na-theme')==='dark'?'dark':'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body data-page="results">
<main class="main" id="main">
<div class="wrap">
  <div class="rhead">
    <div class="rtop1">
      <div>
        <h1 id="h1"></h1>
        <div class="sub" id="sub"></div>
      </div>
      <div class="chips">
        <a class="btn sm" href="search.html">Edit and re-run</a>
        <a class="btn pri sm" href="search.html"><svg class="i sm" aria-hidden="true"><use href="#i-plus"/></svg> New search</a>
      </div>
    </div>
    <div class="strip" aria-label="Search totals and summary">
      <div class="chips" style="gap:6px 18px;flex-wrap:wrap" id="stats" role="list"></div>
      <span class="vr" aria-hidden="true"></span>
      <div class="sumline" id="sumline">
        <svg class="i sm sp-i" aria-hidden="true"><use href="#i-sparkle"/></svg>
        <span class="tx" id="sumtxt"></span>
        <button class="more" id="sumMore" aria-expanded="false" aria-controls="sumtxt">Read more</button>
      </div>
    </div>
  </div>

  <div class="tools" role="toolbar" aria-label="View options">
    <div class="toolrow">
      <span class="tb-lab sr" id="gb">Group by</span>
      <div class="seg" role="group" aria-labelledby="gb">
        <button data-group="company" aria-pressed="true"><svg class="i sm" aria-hidden="true"><use href="#i-building"/></svg>Company</button>
        <button data-group="type" aria-pressed="false"><svg class="i sm" aria-hidden="true"><use href="#i-list"/></svg>Type</button>
      </div>
      <div class="chips" id="filters" role="group" aria-label="Filters" style="gap:6px">
        <button class="chip" data-f="hasJob" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-briefcase"/></svg>Has job</button>
        <button class="chip" data-f="hasPeople" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-users"/></svg>Has contact</button>
        <button class="chip" data-f="strong" aria-pressed="false">Strong fit 75+</button>
        <button class="chip" data-f="notApplied" aria-pressed="false">Not applied</button>
        <button class="chip" data-f="pinned" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-pin"/></svg>Pinned</button>
      </div>
      <span class="sp"></span>
      <select id="sort" aria-label="Sort companies">
        <option value="fit">Sort: Best fit</option>
        <option value="pinned">Pinned first</option>
        <option value="name">Name A-Z</option>
        <option value="jobs">Most jobs</option>
        <option value="people">Most contacts</option>
      </select>
    </div>
    <nav class="jump" aria-label="Jump to company"><span class="tb-lab" id="jl">Jump to</span><ol id="index"></ol></nav>
  </div>

  <section class="centre" aria-label="Results">
    <div class="count-line">
      <span id="countline" aria-live="polite"></span>
      <span class="start" id="startWrap"></span>
      <span class="chips" id="expcol" style="gap:2px"><button class="btn xs ghost" id="expAll"><svg class="i sm" aria-hidden="true"><use href="#i-expand"/></svg>Expand all</button><button class="btn xs ghost" id="colAll"><svg class="i sm" aria-hidden="true"><use href="#i-collapse"/></svg>Collapse all</button></span>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>
</main>

<aside class="detail" id="detail" aria-label="Details" tabindex="-1"></aside>
<div class="sheet-scrim" id="sscrim"></div>

<script src="shell.js"></script>
<script src="data.js"></script>
<script>
(function () {
  var D = DATA, C = D.companies;
  var S = { group: 'company', open: new Set(['tracksuit']), filters: new Set(), sort: 'fit',
    pins: new Set(D.init.pins), applied: new Set(D.init.applied), connected: new Set(D.init.connected),
    more: new Set(), finding: new Set(), active: 'tracksuit', sel: { t: 'p', id: 'p1', role: 'j1' }, draft: {}, copied: false, sumOpen: false };
  var $ = function (s) { return document.querySelector(s); };
  var detail = $('#detail'), sscrim = $('#sscrim'), opener = null;
  var mq = window.matchMedia('(max-width:1179px)');
  function isSheet() { return mq.matches; }
  function findC(id) { return C.filter(function (c) { return c.id === id; })[0]; }
  function findJ(id) { for (var i = 0; i < C.length; i++) for (var j = 0; j < C[i].jobs.length; j++) if (C[i].jobs[j].id === id) return { j: C[i].jobs[j], c: C[i] }; }
  function findP(id) { for (var i = 0; i < C.length; i++) for (var j = 0; j < C[i].people.length; j++) if (C[i].people[j].id === id) return { p: C[i].people[j], c: C[i] }; }
  function jobOf(c, id) { return c.jobs.filter(function (j) { return j.id === id; })[0]; }
  function first(n) { return n.split(' ')[0]; }
  function ini(n) { var p = n.split(' '); return (p[0][0] + (p[p.length - 1][0] || '')).toUpperCase(); }
  function slug(n) { return n.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
  function fitCls(s) { return s >= 80 ? 'strong' : s >= 70 ? 'good' : 'fair'; }
  function fitLab(s) { return s >= 80 ? 'Strong fit' : s >= 70 ? 'Good fit' : 'Possible fit'; }
  function sc(s) { return s >= 80 ? 's1' : s >= 70 ? 's2' : ''; }
  function jobUrl(j, c) { return j.url && j.url !== '#' ? j.url : 'https://www.builtinnyc.com/jobs'; }
  function coUrl(c) { return c.url && c.url !== '#' ? c.url : 'https://www.builtinnyc.com/company/' + slug(c.name); }
  function anyPinned(c) { return S.pins.has(c.id) || c.jobs.some(function (j) { return S.pins.has(j.id); }) || c.people.some(function (p) { return S.pins.has(p.id); }); }
  function visJobs(c) { return S.filters.has('notApplied') ? c.jobs.filter(function (j) { return !S.applied.has(j.id); }) : c.jobs; }
  function rankOf(c) { return C.indexOf(c) + 1; }
  function isSel(t, id) { return S.sel && S.sel.t === t && S.sel.id === id; }

  /* ---------- header ---------- */
  $('#h1').textContent = D.title;
  $('#sub').innerHTML = '<span>' + ic('pin2', 'sm') + D.location + '</span><span>' + ic('clock', 'sm') + 'Searched ' + D.when + '</span><span>' + ic('layers', 'sm') + D.boards + '</span>';
  $('#sumtxt').textContent = D.summary;
  $('#sumMore').onclick = function () {
    S.sumOpen = !S.sumOpen; $('#sumline').classList.toggle('open', S.sumOpen);
    this.setAttribute('aria-expanded', S.sumOpen); this.textContent = S.sumOpen ? 'Show less' : 'Read more';
  };
  function renderStats() {
    var nj = 0, np = 0; C.forEach(function (c) { nj += c.jobs.length; np += c.people.length; });
    $('#stats').innerHTML =
      '<span class="stat co" role="listitem"><b class="num">' + C.length + '</b>companies</span>' +
      '<span class="stat job" role="listitem"><b class="num">' + nj + '</b>jobs <span class="num">(' + S.applied.size + ' applied)</span></span>' +
      '<span class="stat per" role="listitem"><b class="num">' + np + '</b>people <span class="num">(' + S.connected.size + ' connected)</span></span>' +
      '<span class="stat pin" role="listitem"><b class="num">' + S.pins.size + '</b>pinned</span>';
  }
  var topC = C[0], topJ = topC.jobs[0], topP = topC.people[0];
  $('#startWrap').innerHTML = '<span><b>Start here:</b> ' + esc(topP.name) + ' · ' + esc(topJ.title) + '</span><button type="button" id="startBtn" data-k="start">Draft message</button>';

  /* ---------- selection ---------- */
  function select(t, id, role, el) {
    S.sel = { t: t, id: id, role: role || null }; S.copied = false;
    if (t === 'c') S.active = id; else { var f = t === 'j' ? findJ(id) : findP(id); if (f) S.active = f.c.id; }
    if (el) opener = el;
    render();
    if (isSheet() && el !== undefined && el !== false) openSheet();
  }
  function openSheet() {
    detail.classList.add('open'); sscrim.classList.add('open');
    detail.setAttribute('role', 'dialog'); detail.setAttribute('aria-modal', 'true');
    var c = detail.querySelector('.d-close'); if (c) c.focus();
  }
  function closeSheet() {
    if (!detail.classList.contains('open')) return;
    detail.classList.remove('open'); sscrim.classList.remove('open');
    if (opener && document.contains(opener)) opener.focus();
    else { var k = opener && opener.dataset && opener.dataset.k; var e = k && document.querySelector('[data-k="' + k + '"]'); if (e) e.focus(); }
  }
  sscrim.onclick = closeSheet;
  mq.addEventListener ? mq.addEventListener('change', function () { detail.classList.remove('open'); sscrim.classList.remove('open'); detail.removeAttribute('role'); detail.removeAttribute('aria-modal'); }) : 0;

  /* ---------- data selection ---------- */
  function visible() {
    var f = S.filters;
    var l = C.filter(function (c) {
      if (f.has('hasJob') && !c.jobs.length) return false;
      if (f.has('hasPeople') && !c.people.length) return false;
      if (f.has('strong') && c.score < 75) return false;
      if (f.has('pinned') && !anyPinned(c)) return false;
      if (f.has('notApplied') && !visJobs(c).length) return false;
      return true;
    });
    var cmp = { fit: function (a, b) { return b.score - a.score; },
      pinned: function (a, b) { return (anyPinned(b) ? 1 : 0) - (anyPinned(a) ? 1 : 0) || b.score - a.score; },
      name: function (a, b) { return a.name.localeCompare(b.name); },
      jobs: function (a, b) { return b.jobs.length - a.jobs.length || b.score - a.score; },
      people: function (a, b) { return b.people.length - a.people.length || b.score - a.score; } }[S.sort];
    return l.sort(cmp);
  }

  /* ---------- pieces ---------- */
  function pinBtn(id, name, k) {
    var on = S.pins.has(id);
    return '<button class="ibtn pin" data-pin="' + id + '" data-k="' + (k || 'pin-') + id + '" aria-pressed="' + on + '" aria-label="Pin ' + esc(name) + '" title="' + (on ? 'Unpin' : 'Pin') + '">' + ic('pin') + '</button>';
  }
  function statusBtn(kind, id, name, k) {
    var on = (kind === 'app' ? S.applied : S.connected).has(id);
    var lab = kind === 'app' ? ['Mark applied', 'Applied'] : ['Mark connected', 'Connected'];
    return '<button class="status ' + kind + '" data-st="' + kind + ':' + id + '" data-k="' + (k || 'st-') + id + '" aria-pressed="' + on + '" aria-label="' + lab[0] + ': ' + esc(name) + '">' +
      ic('check', 'on') + '<span class="on">' + lab[1] + '</span><span class="off">' + lab[0] + '</span></button>';
  }
  function jobRow(j, c, tag) {
    var pinned = S.pins.has(j.id), done = S.applied.has(j.id), sel = isSel('j', j.id);
    var ppl = c.people.filter(function (p) { return p.about === j.id; }); if (!ppl.length) ppl = c.people.slice(0, 1);
    var cross = ppl.length
      ? '<button class="xlink per" data-sel="p:' + ppl[0].id + ':' + j.id + '" data-k="xm-' + j.id + '">' + ic('send') + 'Message ' + esc(first(ppl[0].name)) + (ppl.length > 1 ? ' +' + (ppl.length - 1) : '') + ' about this role</button>'
      : '<button class="xlink per" data-find="' + c.id + '" data-k="xf-' + j.id + '">' + ic('users') + 'Find people for this role</button>';
    return '<li class="row' + (pinned ? ' pinned' : '') + (done ? ' done' : '') + (sel ? ' sel' : '') + '">' +
      '<button class="rsel" data-sel="j:' + j.id + '" data-k="s-' + j.id + '"' + (sel ? ' aria-current="true"' : '') + '><span class="rmain"><span class="rtitle">' + esc(j.title) + '</span>' +
      '<span class="rmeta">' + (tag ? '<span class="cotag">' + ic('building') + esc(c.name) + '</span>' : '') + '<span>' + esc(j.loc) + '</span>' + (j.sal ? '<span class="sal">' + j.sal + '</span>' : '') +
      '<span class="score num ' + sc(j.score) + '" title="Match score">' + j.score + ' match</span></span></span></button>' +
      '<div class="racts">' + statusBtn('app', j.id, j.title, 'r-st-') + pinBtn(j.id, j.title, 'r-pin-') + '</div>' +
      '<div class="rlinks">' + cross + (tag ? '<button class="xlink" data-goco="' + c.id + '">' + ic('building') + 'View ' + esc(c.name) + '</button>' : '') + '</div></li>';
  }
  function personRow(p, c, tag) {
    var pinned = S.pins.has(p.id), done = S.connected.has(p.id), sel = isSel('p', p.id);
    var j = jobOf(c, p.about) || c.jobs[0];
    return '<li class="row' + (pinned ? ' pinned' : '') + (done ? ' done' : '') + (sel ? ' sel' : '') + '">' +
      '<button class="rsel" data-sel="p:' + p.id + ':' + (j ? j.id : '') + '" data-k="s-' + p.id + '"' + (sel ? ' aria-current="true"' : '') + '><span class="pavatar" aria-hidden="true">' + ini(p.name) + '</span><span class="rmain"><span class="rtitle">' + esc(p.name) + '</span>' +
      '<span class="rmeta">' + (tag ? '<span class="cotag">' + ic('building') + esc(c.name) + '</span>' : '') + '<span>' + esc(p.title) + '</span></span></span></button>' +
      '<div class="racts">' + statusBtn('con', p.id, p.name, 'r-st-') + pinBtn(p.id, p.name, 'r-pin-') + '</div>' +
      (j ? '<div class="rlinks"><button class="xlink job" data-sel="j:' + j.id + '" data-k="xj-' + p.id + '">' + ic('briefcase') + 'Role: ' + esc(j.title) + '</button>' + (tag ? '<button class="xlink" data-goco="' + c.id + '">' + ic('building') + 'View ' + esc(c.name) + '</button>' : '') + '</div>' : '') + '</li>';
  }
  function findBtn(c) {
    var busy = S.finding.has(c.id);
    return '<button class="btn sm" data-find="' + c.id + '" data-k="f-' + c.id + '"' + (busy ? ' disabled' : '') + '>' + (busy ? '<span class="spin"></span>Searching LinkedIn…' : ic('users') + (c.people.length ? 'Find more people' : 'Find people to connect with')) + '</button>' +
      (busy ? '<span style="font-size:13px;color:var(--text2)">Usually 1 to 2 minutes</span>' : '');
  }
  function limited(list, key, n) { var all = S.more.has(key); return { items: all ? list : list.slice(0, n), hidden: all ? 0 : Math.max(0, list.length - n) }; }
  function companyPanel(c) {
    var open = S.open.has(c.id), jobs = visJobs(c), pinned = anyPinned(c), fc = fitCls(c.score), sel = isSel('c', c.id);
    var nApplied = c.jobs.filter(function (j) { return S.applied.has(j.id); }).length;
    var head = '<div class="chead"><h3><button class="ctoggle" data-toggle="' + c.id + '" data-k="t-' + c.id + '" aria-expanded="' + open + '" aria-controls="body-' + c.id + '" aria-label="' + esc(c.name) + ', fit ' + c.score + ', ' + c.jobs.length + ' jobs, ' + c.people.length + ' people">' +
      '<span class="co-ico">' + ic('building', 'lg') + '</span>' +
      '<span><span class="cname"><span class="cn">' + esc(c.name) + '</span><span class="rank num">#' + rankOf(c) + '</span>' + (pinned && !S.pins.has(c.id) ? '<span class="pill pin">' + ic('pin', 'sm') + 'Pinned item</span>' : '') + '</span>' +
      '<span class="cdesc">' + esc(c.desc) + '</span></span>' +
      '<span class="cmeta"><span class="counts"><span class="pill job">' + ic('briefcase', 'sm') + c.jobs.length + ' job' + (c.jobs.length === 1 ? '' : 's') + '</span>' +
      (c.people.length ? '<span class="pill per">' + ic('users', 'sm') + c.people.length + ' people</span>' : '<span class="pill neu">No contacts yet</span>') + '</span>' +
      '<span class="fit ' + fc + '"><b class="num">' + c.score + '</b><span class="bar"><i style="width:' + c.score + '%"></i></span><small>' + fitLab(c.score) + '</small></span></span>' +
      ic('chevron', 'chev') + '</button></h3>' + pinBtn(c.id, c.name) + '</div>';
    var body = '';
    if (open) {
      var jl = limited(jobs, 'j' + c.id, 3), pl = limited(c.people, 'p' + c.id, 3);
      body = '<div class="two">' +
        '<section class="pane jobs" aria-label="Jobs at ' + esc(c.name) + '"><header><h4>' + ic('briefcase') + 'Open jobs <span class="c num">' + jobs.length + '</span></h4>' + (nApplied ? '<span class="pill app num">' + nApplied + ' applied</span>' : '') + '</header>' +
        (jobs.length ? '<ul class="rows">' + jl.items.map(function (j) { return jobRow(j, c); }).join('') + '</ul>' : '<div class="empty">No matching jobs' + (S.filters.has('notApplied') ? ' left to apply to.' : ' found.') + '</div>') +
        (jl.hidden ? '<footer><button class="btn xs" data-more="j' + c.id + '" data-k="mj-' + c.id + '">Show ' + jl.hidden + ' more job' + (jl.hidden > 1 ? 's' : '') + ' ' + ic('chevron', 'sm') + '</button></footer>' : '') + '</section>' +
        '<section class="pane people" aria-label="People at ' + esc(c.name) + '"><header><h4>' + ic('users') + 'People to connect with <span class="c num">' + c.people.length + '</span></h4></header>' +
        (c.people.length ? '<ul class="rows">' + pl.items.map(function (p) { return personRow(p, c); }).join('') + '</ul>' :
          '<div class="empty"><span>' + (c.searched ? 'No current employees found yet.' : 'You have not searched for contacts here yet.') + '</span></div>') +
        '<footer>' + (pl.hidden ? '<button class="btn xs" data-more="p' + c.id + '" data-k="mp-' + c.id + '">Show ' + pl.hidden + ' more ' + ic('chevron', 'sm') + '</button>' : '') + findBtn(c) + '</footer></section></div>';
    }
    return '<article class="co-panel' + (pinned ? ' pinned' : '') + (sel ? ' sel' : '') + '" id="co-' + c.id + '" data-open="' + open + '">' + head +
      (open ? '<div class="cbody" id="body-' + c.id + '">' + body + '</div>' : '') + '</article>';
  }
  function typeView(cs) {
    var jobs = [], people = [];
    cs.forEach(function (c) { visJobs(c).forEach(function (j) { jobs.push([j, c]); }); c.people.forEach(function (p) { people.push([p, c]); }); });
    jobs.sort(function (a, b) { return b[0].score - a[0].score; });
    return '<section class="tsec" id="t-companies"><h2 style="color:var(--co-d)">' + ic('building', 'lg') + 'Companies <span class="pill co num">' + cs.length + '</span></h2><div class="list">' +
      cs.map(function (c) {
        return '<div class="co-panel' + (anyPinned(c) ? ' pinned' : '') + (isSel('c', c.id) ? ' sel' : '') + '"><div class="chead"><h3><button class="ctoggle" data-sel="c:' + c.id + '" data-k="s-' + c.id + '" aria-label="Show details: ' + esc(c.name) + '"><span class="co-ico">' + ic('building', 'lg') + '</span><span><span class="cname"><span class="cn">' + esc(c.name) + '</span><span class="rank num">#' + rankOf(c) + '</span></span><span class="cdesc">' + esc(c.desc) + '</span></span><span class="cmeta"><span class="counts"><span class="pill job">' + c.jobs.length + (c.jobs.length === 1 ? ' job' : ' jobs') + '</span><span class="pill ' + (c.people.length ? 'per' : 'neu') + '">' + (c.people.length ? c.people.length + ' people' : 'No contacts yet') + '</span></span><span class="fit ' + fitCls(c.score) + '"><b class="num">' + c.score + '</b><span class="bar"><i style="width:' + c.score + '%"></i></span><small>' + fitLab(c.score) + '</small></span></span><span></span></button></h3>' + pinBtn(c.id, c.name) + '</div></div>'; }).join('') + '</div></section>' +
      '<section class="tsec" id="t-jobs"><h2 style="color:var(--job-d)">' + ic('briefcase', 'lg') + 'Jobs <span class="pill job num">' + jobs.length + '</span></h2><div class="tcard"><ul class="rows">' + jobs.map(function (x) { return jobRow(x[0], x[1], true); }).join('') + '</ul></div></section>' +
      '<section class="tsec" id="t-people"><h2 style="color:var(--per-d)">' + ic('users', 'lg') + 'People <span class="pill per num">' + people.length + '</span></h2><div class="tcard"><ul class="rows">' + people.map(function (x) { return personRow(x[0], x[1], true); }).join('') + '</ul></div></section>';
  }
  function renderIndex(cs) {
    if (S.group === 'type') {
      $('#jl').textContent = 'Jump to';
      $('#index').innerHTML = [['companies', 'building', 'Companies'], ['jobs', 'briefcase', 'Jobs'], ['people', 'users', 'People']].map(function (x) {
        return '<li><button data-jumpt="' + x[0] + '" data-k="jt-' + x[0] + '">' + ic(x[1], 'sm') + x[2] + '</button></li>'; }).join('');
      return;
    }
    $('#jl').textContent = 'Jump to company';
    $('#index').innerHTML = cs.map(function (c) {
      return '<li><button data-jump="' + c.id + '" data-k="j-' + c.id + '"' + (S.active === c.id ? ' aria-current="true"' : '') + '><span class="rk num">' + rankOf(c) + '</span>' + esc(c.name) + '<span class="sc num">' + c.score + '</span>' + (anyPinned(c) ? '<span class="pn" title="Has pinned items">' + ic('pin') + '<span class="sr">has pinned items</span></span>' : '') + '</button></li>'; }).join('');
  }

  /* ---------- detail pane ---------- */
  function msgFor(p, c, roleId) {
    var j = roleId ? jobOf(c, roleId) : null;
    return 'Hi ' + first(p.name) + ', I\'m a software engineer at Dover building agentic LLM tools. ' +
      (j ? 'I\'m interested in the ' + j.title + ' role at ' + c.name + '. ' : '') + p.hook;
  }
  function relRow(kind, o, c) {
    if (kind === 'j') return '<li><button data-sel="j:' + o.id + '" data-k="d-j-' + o.id + '"><span class="co-ico" style="width:30px;height:30px;background:var(--job-t);color:var(--job-d)">' + ic('briefcase', 'sm') + '</span><span class="t">' + esc(o.title) + '<small>' + esc(o.loc) + (o.sal ? ' · ' + o.sal : '') + '</small></span><span class="score num ' + sc(o.score) + '">' + o.score + '</span></button></li>';
    return '<li><button data-sel="p:' + o.id + ':' + (o.about || '') + '" data-k="d-p-' + o.id + '"><span class="pavatar" aria-hidden="true">' + ini(o.name) + '</span><span class="t">' + esc(o.name) + '<small>' + esc(o.title) + '</small></span>' + (S.connected.has(o.id) ? '<span class="pill con">Connected</span>' : '') + '</button></li>';
  }
  function dHead(kind, label, icon, title, subHtml, pinId, avatar) {
    return '<div class="d-head">' + (avatar ? '<span class="pavatar" aria-hidden="true">' + avatar + '</span>' : '') + '<div class="grow"><div class="d-kind ' + kind + '">' + ic(icon, 'sm') + label + '</div><h2 id="dtitle">' + esc(title) + '</h2><div class="sub">' + subHtml + '</div></div>' +
      pinBtn(pinId, title, 'd-pin-') + '<button class="ibtn d-close" data-close aria-label="Close details" data-k="d-close">' + ic('x', 'lg') + '</button></div>';
  }
  function renderDetail() {
    var s = S.sel, h = '';
    if (!s) { detail.innerHTML = '<div class="d-empty"><span class="ic">' + ic('layers', 'lg') + '</span><b>Select a company, job or person</b><span>Details, the alignment note and a ready-to-send message appear here.</span></div>'; return; }
    if (s.t === 'c') {
      var c = findC(s.id);
      h = dHead('co', 'Company', 'building', c.name, '<span class="fit ' + fitCls(c.score) + '" style="flex-direction:row;align-items:baseline;gap:8px;display:inline-flex"><b class="num">' + c.score + '</b> ' + fitLab(c.score) + ' · rank #' + rankOf(c) + '</span>', c.id) +
        '<div class="d-body"><p>' + esc(c.desc) + '</p><div class="note c"><div class="lab">How you align</div>' + esc(c.align) + '</div>' +
        '<div class="rel"><h3>' + ic('briefcase', 'sm') + 'Jobs (' + c.jobs.length + ')</h3>' + (c.jobs.length ? '<ul>' + c.jobs.map(function (j) { return relRow('j', j, c); }).join('') + '</ul>' : '<p class="facts">No jobs found.</p>') + '</div>' +
        '<div class="rel"><h3>' + ic('users', 'sm') + 'People (' + c.people.length + ')</h3>' + (c.people.length ? '<ul>' + c.people.map(function (p) { return relRow('p', p, c); }).join('') + '</ul>' : '<p class="facts">' + (c.searched ? 'No current employees found yet.' : 'No contact search run yet.') + '</p>') + '<div style="margin-top:8px">' + findBtn(c) + '</div></div></div>' +
        '<div class="d-foot"><a class="btn pri" href="' + coUrl(c) + '" target="_blank" rel="noopener">' + ic('ext') + 'Open company page</a></div>';
    } else if (s.t === 'j') {
      var f = findJ(s.id), j = f.j, jc = f.c, ppl = jc.people.filter(function (p) { return p.about === j.id; }); if (!ppl.length) ppl = jc.people.slice(0, 4);
      h = dHead('job', 'Job', 'briefcase', j.title, '<button class="xlink" data-sel="c:' + jc.id + '" data-k="d-co">' + ic('building') + esc(jc.name) + ' · view company</button>', j.id) +
        '<div class="d-body"><div class="facts"><span>' + ic('pin2', 'sm') + esc(j.loc) + '</span>' + (j.sal ? '<span class="sal">' + j.sal + '</span>' : '') + '<span class="score num ' + sc(j.score) + '">' + j.score + ' match</span></div>' +
        '<div class="note"><div class="lab">How you align</div>' + esc(j.align) + '</div>' +
        '<div class="rel"><h3>' + ic('users', 'sm') + 'People to ask about this role</h3>' + (ppl.length ? '<ul>' + ppl.map(function (p) { return relRow('p', p, jc); }).join('') + '</ul>' : '<p class="facts">No contacts yet for ' + esc(jc.name) + '.</p><div style="margin-top:8px">' + findBtn(jc) + '</div>') + '</div></div>' +
        '<div class="d-foot"><a class="btn pri" href="' + jobUrl(j, jc) + '" target="_blank" rel="noopener">' + ic('ext') + 'Open job posting</a>' + statusBtn('app', j.id, j.title, 'd-st-') + '</div>';
    } else {
      var q = findP(s.id), p = q.p, pc = q.c, role = s.role !== null && s.role !== undefined ? s.role : (p.about || ''), dk = p.id + ':' + role;
      if (S.draft[dk] === undefined) S.draft[dk] = msgFor(p, pc, role);
      var msg = S.draft[dk], rj = role ? jobOf(pc, role) : null;
      h = dHead('per', 'Person', 'user', p.name, esc(p.title) + ' · <button class="xlink" data-sel="c:' + pc.id + '" data-k="d-co">' + esc(pc.name) + '</button>', p.id, ini(p.name)) +
        '<div class="d-body"><div class="note p"><div class="lab">Why connect</div>' + esc(p.align) + '</div>' +
        '<div class="field"><label for="drole">About which role?</label><select id="drole" data-k="d-role"><option value="">General introduction</option>' +
        pc.jobs.map(function (x) { return '<option value="' + x.id + '"' + (x.id === role ? ' selected' : '') + '>' + esc(x.title) + '</option>'; }).join('') + '</select>' +
        (rj ? '<button class="xlink job" data-sel="j:' + rj.id + '" data-k="d-rj" style="margin-top:4px">' + ic('briefcase') + 'View this role</button>' : '') + '</div>' +
        '<div class="field msgbox"><label for="dmsg">Example LinkedIn message</label><textarea id="dmsg" data-k="d-msg">' + esc(msg) + '</textarea>' +
        '<div class="cc"><span>Edit freely before sending.</span><span class="num" id="dcc" aria-live="polite"></span></div></div></div>' +
        '<div class="d-foot"><button class="btn pri" id="dcopy" data-copy data-k="d-copy">' + (S.copied ? ic('check') + '<span>Copied to clipboard</span>' : ic('copy') + '<span>Copy message</span>') + '</button>' +
        '<a class="btn" href="https://www.linkedin.com/in/' + slug(p.name) + '" target="_blank" rel="noopener">' + ic('ext') + 'Open LinkedIn</a>' + statusBtn('con', p.id, p.name, 'd-st-') + '</div>';
    }
    detail.innerHTML = h;
    if (detail.classList.contains('open')) detail.setAttribute('aria-labelledby', 'dtitle');
    var ta = $('#dmsg'); if (ta) cc();
  }
  function cc() { var ta = $('#dmsg'), n = ta.value.length; var e = $('#dcc'); e.innerHTML = n > 300 ? '<span class="over">' + n + ' / 300, trim before sending</span>' : n + ' / 300 characters'; }
  function curKey() { var s = S.sel; if (!s || s.t !== 'p') return null; var p = findP(s.id); return p.p.id + ':' + (s.role !== null && s.role !== undefined ? s.role : (p.p.about || '')); }

  /* ---------- render ---------- */
  function render() {
    var ak = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    var sy = window.scrollY;
    var cs = visible();
    renderStats();
    var total = 0; cs.forEach(function (c) { total += visJobs(c).length; });
    $('#countline').textContent = cs.length + ' of ' + C.length + ' companies shown';
    $('#expcol').style.display = S.group === 'company' ? '' : 'none';
    document.querySelectorAll('[data-group]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.group === S.group); });
    document.querySelectorAll('[data-f]').forEach(function (b) { b.setAttribute('aria-pressed', S.filters.has(b.dataset.f)); });
    renderIndex(cs);
    $('#list').innerHTML = !cs.length ? '<div class="card empty" style="padding:28px"><b>No matching companies found.</b><span>Try removing a filter.</span><button class="btn sm" id="clear">Clear filters</button></div>' : (S.group === 'type' ? typeView(cs) : cs.map(companyPanel).join(''));
    renderDetail();
    window.scrollTo(0, sy);
    if (ak) { var e = document.querySelector('[data-k="' + ak + '"]'); if (e && e.id !== 'dmsg' ) e.focus({ preventScroll: true }); }
  }

  /* ---------- events ---------- */
  function scrollToCo(id) { var e = document.getElementById('co-' + id); if (e) e.scrollIntoView({ block: 'start' }); }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a'); if (!t) return;
    var d = t.dataset;
    if (d.sel) { var a = d.sel.split(':'); select(a[0], a[1], a[2], t); return; }
    if (d.toggle) { S.open.has(d.toggle) ? S.open.delete(d.toggle) : S.open.add(d.toggle); S.sel = { t: 'c', id: d.toggle, role: null }; S.active = d.toggle; opener = t; render(); if (isSheet() && false) openSheet(); return; }
    if (d.close !== undefined) { closeSheet(); return; }
    if (d.pin) { S.pins.has(d.pin) ? S.pins.delete(d.pin) : S.pins.add(d.pin); render(); var pb = document.querySelector('[data-k="' + t.dataset.k + '"]'); if (pb) { pb.classList.add('pop'); } return; }
    if (d.st) { var s = d.st.split(':'), set = s[0] === 'app' ? S.applied : S.connected; set.has(s[1]) ? set.delete(s[1]) : set.add(s[1]); render(); return; }
    if (d.more) { S.more.add(d.more); render(); return; }
    if (d.find) {
      S.finding.add(d.find); render();
      setTimeout(function () { S.finding.delete(d.find); render(); toast('Mockup: the agent would now search LinkedIn for people at ' + findC(d.find).name); }, 2200); return; }
    if (d.goco) { S.group = 'company'; S.open.add(d.goco); S.active = d.goco; render(); scrollToCo(d.goco); return; }
    if (d.jump) { S.open.add(d.jump); S.sel = { t: 'c', id: d.jump, role: null }; S.active = d.jump; render(); scrollToCo(d.jump); var jb = document.querySelector('[data-jump="' + d.jump + '"]'); if (jb) jb.focus({ preventScroll: true }); return; }
    if (d.jumpt) { var el = document.getElementById('t-' + d.jumpt); if (el) el.scrollIntoView({ block: 'start' }); return; }
    if (d.group) { S.group = d.group; render(); window.scrollTo(0, 0); return; }
    if (d.f) { S.filters.has(d.f) ? S.filters.delete(d.f) : S.filters.add(d.f); render(); return; }
    if (t.id === 'clear') { S.filters.clear(); render(); return; }
    if (t.id === 'expAll') { visible().forEach(function (c) { S.open.add(c.id); }); render(); return; }
    if (t.id === 'colAll') { S.open.clear(); render(); return; }
    if (t.id === 'startBtn') { select('p', topP.id, topJ.id, t); return; }
    if (d.copy !== undefined) {
      var ta = $('#dmsg'), txt = ta.value, done = function () { S.copied = true; renderDetail(); var b = $('#dcopy'); if (b) b.focus(); toast('Message copied'); setTimeout(function () { S.copied = false; if (S.sel && S.sel.t === 'p') { var fk = document.activeElement && document.activeElement.dataset.k; renderDetail(); if (fk) { var x = document.querySelector('[data-k="' + fk + '"]'); if (x) x.focus(); } } }, 2200); };
      var fb = function () { ta.focus(); ta.select(); try { document.execCommand('copy'); } catch (er) {} done(); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fb); else fb();
      return;
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'dmsg') { S.draft[curKey()] = e.target.value; cc(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'sort') { S.sort = e.target.value; render(); }
    if (e.target.id === 'drole') { S.sel.role = e.target.value; S.copied = false; renderDetail(); var r = $('#drole'); if (r) r.focus(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  /* active company follows scroll */
  var tick = false;
  window.addEventListener('scroll', function () {
    if (tick || S.group !== 'company') return; tick = true;
    requestAnimationFrame(function () {
      tick = false; var cur = null;
      document.querySelectorAll('.co-panel[id]').forEach(function (p) { if (p.getBoundingClientRect().bottom > 200 && !cur) cur = p.id.replace('co-', ''); });
      if (cur && cur !== S.active) { S.active = cur; document.querySelectorAll('[data-jump]').forEach(function (b) { if (b.dataset.jump === cur) { b.setAttribute('aria-current', 'true'); b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } else b.removeAttribute('aria-current'); }); }
    });
  }, { passive: true });
  render();
})();
</script>
</body>
</html>
