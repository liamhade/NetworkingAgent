<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Networking Agent — Progress Dashboard</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1f2328; --muted:#6b7280; --done:#2f7d4f; --cur:#2563eb; --next:#9ca3af; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --card:#1f2228; --ink:#e6e6e6; --muted:#9aa0a6; --line:#2e323a; } }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:860px; margin:40px auto; padding:0 20px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:24px; }
  .meter { background:var(--line); border-radius:999px; height:14px; overflow:hidden; }
  .meter > div { height:100%; background:var(--done); transition:width .4s; }
  .meter-label { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin:6px 0 28px; }
  section { margin-bottom:28px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  .item { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--next); border-radius:8px; padding:12px 14px; margin-bottom:8px; }
  .item.done { border-left-color:var(--done); }
  .item.current { border-left-color:var(--cur); }
  .item .t { font-weight:600; }
  .item .n { color:var(--muted); font-size:13px; margin-top:2px; }
  .item .c { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--muted); }
  .empty { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>Networking Agent — Progress</h1>
  <div class="sub" id="updated"></div>
  <div class="meter"><div id="bar"></div></div>
  <div class="meter-label"><span id="count"></span><span id="pct"></span></div>
  <section><h2>Current</h2><div id="current"></div></section>
  <section><h2>Next</h2><div id="next"></div></section>
  <section><h2>Done</h2><div id="done"></div></section>
</main>
<script>
// Edit this block to update the dashboard. status: "done" | "current" | "next"
const UPDATED = "2026-11-13";
const TASKS = [
  { title: "Store previous searches", status: "done", commit: "15be6ff", note: "Left side-panel of past searches + minimal TEST_USER account layer (get_current_user, /api/me, database/users/<id>/)." },
  { title: "Keep log of applied jobs / connected people", status: "done", note: "APPLIED / CONNECTED toggles keyed by stable entity IDs (normalized URL / LinkedIn slug), persisted per user.", commit: "5836ba3" },
  { title: "Companies / Jobs / People pages in menu bar", status: "done", commit: "624368e", note: "Top nav + per-entity card pages, aggregated & deduped across all saved searches; refresh on each new search." },
  { title: "Add read_page() tool", status: "done", commit: "07df208", note: "URL → Markdown: trafilatura default; Greenhouse/Lever/Ashby APIs, JSON-LD, cleaned-full and Playwright fallbacks; per-domain registry." },
  { title: "Investigate speeding up Google SERP", status: "done", commit: "3222146", note: "Resolve only returned /goto links + 15-min query cache: google_search n=5 23.7s → 5.3s, find_people 24s → 0.6s. No CAPTCHAs." },
  { title: "Log token usage for each LLM", status: "done", commit: "8299d78", note: "LangChain callback writes one CSV row per LLM call (user, search, tokens, cost, latency) to backend/logs/llm_usage.csv; python -m llm_usage summaries." },
  { title: "Sort companies / jobs / people pages", status: "done", commit: "81df458", note: "Client-side Sort dropdown (BoardUI Select) per page: recency, status (applied/connected) first, A–Z, most jobs/contacts; logic in utils/sort-entities.ts." },
  { title: "Add X/Y counts to Jobs & People pages", status: "done", commit: "60cf35a", note: "Title chip reads \"3/12 applied\" / \"5/40 connected\", recomputed live on toggle (utils/count-status.ts)." },
  { title: "Example LinkedIn connection message", status: "done", commit: "8ba97d1", note: "connect_message generated in the existing compile call (no extra LLM calls), clamped to LINKEDIN_MESSAGE_MAX_CHARS (300); prompts in prompts.py; copyable bubble." },
  { title: "Pin entities for later", status: "done", commit: "c83637f", note: "Pushpin toggle on all cards, per-user pins.json + GET/PUT /api/pins, \"Pinned first\" sort on every page; shared use-keyed-toggles hook." },
  { title: "Clean up google_serp (and builtin_nyc) modules", status: "done", commit: "cf65f13", note: "Removed cli/__main__/errors/metadata/pagination; google_serp 643 → 337 lines, builtin_nyc 427 → 381; agent behavior (profile, CAPTCHA, /goto, cache) unchanged." },
  { title: "Frontend test runner + pinned-behavior tests", status: "done", note: "Vitest + jsdom + Testing Library (npm run test): 52 tests across sort, counts, toggle hook, PinToggle, and App-level pin/sort/rollback flows." },
];

function render() {
  const done = TASKS.filter(t => t.status === "done").length;
  const pct = Math.round(100 * done / TASKS.length);
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("count").textContent = `${done} of ${TASKS.length} tasks complete`;
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("updated").textContent = "Last updated " + UPDATED;
  for (const s of ["current", "next", "done"]) {
    const el = document.getElementById(s);
    const items = TASKS.filter(t => t.status === s);
    el.innerHTML = items.length ? "" : '<div class="empty">Nothing here.</div>';
    for (const t of items) {
      const d = document.createElement("div");
      d.className = "item " + s;
      d.innerHTML = `<div class="t"></div><div class="n"></div>` + (t.commit ? `<div class="c"></div>` : "");
      d.querySelector(".t").textContent = t.title;
      d.querySelector(".n").textContent = t.note;
      if (t.commit) d.querySelector(".c").textContent = "commit " + t.commit;
      el.appendChild(d);
    }
  }
}
render();
</script>
</body>
</html>
